name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: astral-sh/setup-uv@v6.8.0
        with:
          version: "0.10.9"
      - run: uv sync --frozen
      - uses: actions/cache@v4.2.3
        with:
          path: ~/.cache/cairn/models
          key: weights-${{ hashFiles('data/guidance/weights.json') }}
      - run: uv run cairn guidance weights
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      # Coverage gate (85%) is in pyproject addopts.
      - run: uv run pytest
