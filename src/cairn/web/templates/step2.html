{% extends "base.html" %}
{% import "_anatomy.html" as a with context %}
{% block main %}
{% call a.step(2, "Ask", "RECORDED", "The model picks the tools and drafts; code places every number.") %}
<form class="controls" hx-post="/step/2/run" hx-target="#result">
  <select name="question">{% for id, text in questions.items() %}<option value="{{ id }}">{{ id }}: {{ text }}</option>{% endfor %}</select>
  <button type="submit">Ask</button>
</form>
<div id="result"></div>
<p class="prod">In production → live model calls through a gateway.</p>
{% endcall %}
{% endblock %}
